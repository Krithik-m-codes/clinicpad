name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinicpad
          POSTGRES_PASSWORD: clinicpad
          POSTGRES_DB: clinicpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicpad -d clinicpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinicpad_app:clinicpad_app@localhost:5432/clinicpad
      DIRECT_URL: postgresql://clinicpad:clinicpad@localhost:5432/clinicpad
      ADMIN_DATABASE_URL: postgresql://clinicpad:clinicpad@localhost:5432/clinicpad
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOTENBERG_URL: http://localhost:3001
      GOTENBERG_REQUIRED: "1"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PyMuPDF (AGPL-3.0, test-only: it reads the PDFs in tests/integration/overlay-spacer-pdf.test.ts and is never
      # shipped). Pinned; that test fails, not skips, when it is missing and CI=true.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.0
      - run: node scripts/verify-build-config.mjs
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      # Same hardening flags as docker-compose.yml (see the comment block there); keep them in sync.
      - run: >-
          docker run -d --name gotenberg -p 127.0.0.1:3001:3000
          --add-host=host.docker.internal:host-gateway
          --cap-drop ALL --security-opt no-new-privileges:true --memory 1g --pids-limit 512
          gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
          gotenberg --api-timeout=30s --api-disable-download-from --webhook-disable
          --libreoffice-disable-routes --pdfengines-disable-routes
          --chromium-disable-javascript=true
          "--chromium-deny-list=^(?!file:///tmp/|data:|about:|blob:).*"
          --log-level=warn
      - run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && break; sleep 2; done
          curl -sf http://localhost:3001/health
      # Same image and options as the clamav service in docker-compose.yml; keep them in sync (tests/unit/engine-pins.test.ts).
      # No freshclam in CI: the signatures baked into the image are deterministic and need no network.
      - run: >-
          docker run -d --name clamav -p 127.0.0.1:3310:3310
          --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add FOWNER
          --security-opt no-new-privileges:true --read-only
          --tmpfs /tmp --tmpfs /run --tmpfs /var/log/clamav:uid=100,gid=101
          -v clamav_db:/var/lib/clamav -e CLAMAV_NO_FRESHCLAMD=true
          --memory 2500m --pids-limit 256
          clamav/clamav:1.4.6@sha256:4cc4350d3fded380caf1799e76c0d1c93f3fa40af99c0cb2862ec0c9b117718a
      - run: |
          for i in $(seq 1 60); do printf 'zPING\0' | timeout 2 nc 127.0.0.1 3310 | grep -q PONG && break; sleep 5; done
          printf 'zPING\0' | timeout 2 nc 127.0.0.1 3310 | grep -q PONG
      - run: npm run test
      - run: npm run build:web
      - run: npm run build:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
